[project]
name = "ecommerce-conversion-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "plotly>=6.9.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "xgboost>=3.4.1",
]

[project.scripts]
ecommerce-conversion-analysis = "ecommerce_conversion_analysis:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
